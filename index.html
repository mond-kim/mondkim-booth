<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex, nofollow, noarchive"><meta name="googlebot" content="noindex, nofollow">
<title>대형 테이블 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* one-screen viewer: tab strip on top, one or two live studios below */
:root{--bg:#e9e9eb;--panel:#ffffff;--ink:#1d1d1f;--sub:#68686e;--line:#d2d2d7;--on:#232326;--on-ink:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#151517;--panel:#1f1f22;--ink:#ececef;--sub:#a1a1a8;--line:#3a3a40;--on:#ececef;--on-ink:#151517;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151517;--panel:#1f1f22;--ink:#ececef;--sub:#a1a1a8;--line:#3a3a40;--on:#ececef;--on-ink:#151517;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
header{display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
.top{display:flex;align-items:center;gap:10px;min-width:0}h1{margin:0;font-size:17px;white-space:nowrap;text-wrap:balance}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
button,select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
button.on{background:var(--on);color:var(--on-ink);border-color:var(--on)}
button:focus-visible,select:focus-visible{outline:2px solid var(--sub);outline-offset:2px}
#desc{color:var(--sub);font-size:12.5px;min-width:0}
#stage{flex:1;display:flex;gap:6px;min-height:0}
.pane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pane .ph{display:none;padding:5px 8px;border-bottom:1px solid var(--line);font-size:12.5px;gap:8px;align-items:center;min-width:0}
.duo .pane .ph{display:flex}.pane .ph span{color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
iframe{flex:1;width:100%;min-height:0;border:0;display:block;background:#ececee}
#p1{display:none}.duo #p1{display:flex}
@media (max-width:760px){
 .top{flex-wrap:wrap}h1{font-size:15px}
 .tabs{order:3;flex:1 0 100%;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}.tabs::-webkit-scrollbar{display:none}
 .tabs button{flex:0 0 auto;padding:5px 10px;font-size:12.5px}#duo{margin-left:auto;padding:5px 10px;font-size:12.5px}
 #desc{font-size:11.5px}#stage{flex-direction:column}
}
</style>
<header><div class="top"><h1>대형 테이블 시안</h1><div class="tabs" id="tabs"></div><button id="duo">나란히 비교</button></div><div id="desc"></div></header>
<div id="stage"><div class="pane" id="p0"><div class="ph"><select id="sel0" aria-label="왼쪽 시안"></select><span></span></div><iframe title="시안"></iframe></div>
<div class="pane" id="p1"><div class="ph"><select id="sel1" aria-label="오른쪽 시안"></select><span></span></div><iframe title="비교 시안"></iframe></div></div>

<script>
const T = [{"id": "big1300v2", "label": "1300x950 table v2", "file": "십자테이블_1300x950_table_v2.html", "desc": "낮은 테이블 v2 · 유리 타원 1300×950 · 윗면 450 · 띠 창살에 v7.1 장미 · 다리 장미 넝쿨 밀도 · 띠-다리 모서리 계단(R10) · 처마 판2 형태 · 유리 12T · 철판 15.1 kg + 유리 29.1 kg"}, {"id": "big1000v2", "label": "1000x790 table v2", "file": "십자테이블_1000x790_table_v2.html", "desc": "높은 테이블 v2 · 유리 타원 1000×790 · 윗면 730 · 띠 창살에 v7.1 장미 · 다리·무릎 장미 넝쿨 · 띠-다리 모서리 계단(R10) · 처마 판2 형태 · 유리 12T · 철판 18.4 kg + 유리 18.6 kg"}, {"id": "t380v71", "label": "380 table v7.1 최종", "file": "십자테이블_380table-v7.1.html", "desc": "최종 · 발주 완료 · 유리 Ø380 8T · 윗면 750 · 바닥 폭 605 · 대형 테이블 다리의 원본"}, {"id": "big1300", "label": "1300x950 table v1", "file": "십자테이블_1300x950_table_v1.html", "desc": "v1 (이전) · 낮은 테이블 · 철판 13.0 kg · 판1 처마 갈고리 · 둥근 까치발"}, {"id": "big1000", "label": "1000x790 table v1", "file": "십자테이블_1000x790_table_v1.html", "desc": "v1 (이전) · 높은 테이블 · 철판 16.5 kg · 판1 처마 갈고리 · 둥근 까치발"}], stage = document.getElementById("stage"), tabs = document.getElementById("tabs");
const SRC = true;   // artifact: each studio is its own published page (s/<id>.html); local file: embedded copies
const html = id => JSON.parse(document.getElementById("d_" + id).textContent);
const shown = ["big1000v2", "big1300v2"];
const fromHash = location.hash.slice(1); if (T.some(t => t.id === fromHash)) shown[0] = fromHash;
function load(k, id) {
  const p = document.getElementById("p" + k), f = p.querySelector("iframe"), t = T.find(t => t.id === id);
  if (f.dataset.id !== id) { if (SRC) f.src = id + ".html"; else f.srcdoc = html(id); f.dataset.id = id; }
  p.querySelector("select").value = id; p.querySelector("span").textContent = t.desc; shown[k] = id;
}
function unload(k) { const f = document.getElementById("p" + k).querySelector("iframe"); if (SRC) f.removeAttribute("src"); else f.srcdoc = ""; f.dataset.id = ""; }
function render() {
  const duo = stage.classList.contains("duo"), t = T.find(t => t.id === shown[0]);
  [...tabs.children].forEach(b => b.classList.toggle("on", b.dataset.id === shown[0]));
  document.getElementById("desc").textContent = duo ? "각 창 위 목록에서 시안을 고르세요. 창마다 따로 돌려볼 수 있어요." : t.desc;
  load(0, shown[0]); if (duo) load(1, shown[1]); else unload(1);
}
for (const t of T) {
  const b = document.createElement("button"); b.textContent = t.label; b.dataset.id = t.id; b.onclick = () => { shown[0] = t.id; render(); }; tabs.appendChild(b);
}
for (const k of [0, 1]) {
  const s = document.getElementById("p" + k).querySelector("select");
  s.innerHTML = T.map(t => `<option value="${t.id}">${t.label}</option>`).join(""); s.onchange = () => { shown[k] = s.value; render(); };
}
document.getElementById("duo").onclick = e => { stage.classList.toggle("duo"); e.target.classList.toggle("on"); if (shown[1] === shown[0]) shown[1] = T.find(t => t.id !== shown[0]).id; render(); };
render();
</script>
</html>
